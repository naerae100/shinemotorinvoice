<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint into the area a camera cutout
         occupies instead of letterboxing around it; the safe-area insets in
         index.css keep the controls out from under it. interactive-widget
         stops the Android keyboard from shrinking the viewport, which was
         resizing the layout under a field that was being typed into. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <!-- Full screen when launched from the home screen on iOS, to match the
         manifest's display:fullscreen on Android. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Shine Motor — Docket &amp; Invoice System</title>
    <meta name="description" content="Scrap metal purchasing, tax invoicing and container export for Shine Motor Corporation." />

    <!-- The wave from the company logo, not a stand-in. There was an
         SVG here drawing an abstract two-stroke wave, on the reasoning that
         the wordmark is illegible at 16px — true of the words, but the wave
         mark itself reads perfectly, and having an invented glyph in the tab
         beside the real one on the home screen was the actual problem. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#141F24" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
